<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMARTMARKET-GUAYAQUIL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17263d;font:15px system-ui}header{background:#123258;color:white;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:21px;margin:0}h2{margin:0 0 16px}small,.muted{color:#57687d}header small{color:#d3e5fa}main{max-width:1200px;margin:24px auto;padding:0 20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}button{border:0;border-radius:8px;padding:11px 16px;background:#e0e9f6;color:#183b65;font:inherit;cursor:pointer}button.primary,nav button.active{background:#1867c9;color:white}button.danger{background:#fff0ed;color:#b52b21}button:disabled{opacity:.5;cursor:wait}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #b8c8dd;border-radius:7px;font:inherit;background:white}label{display:block;margin:12px 0}label span{display:block;margin-bottom:6px}.card{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:24px;box-shadow:0 4px 16px #12325806}.login{max-width:440px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.metric{font-size:30px;font-weight:700;margin-top:14px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}.toolbar label{margin:0;min-width:150px;flex:1}.table{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5eaf2;vertical-align:top}th{font-size:13px;color:#526781}td button{padding:7px 10px;margin:2px}#mensaje{padding:14px;border-radius:8px;background:#e1efff;margin-bottom:18px;white-space:pre-wrap}#mensaje.error{background:#ffe8e3;color:#943027}.badge{border-radius:20px;padding:5px 9px;font-size:12px;background:#e7f5ed;color:#18613a}.badge.low{background:#fff0d6;color:#8c5500}.badge.zero{background:#ffe6e1;color:#a23027}dialog{border:0;border-radius:15px;padding:24px;width:min(650px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#12325880}.actions{display:flex;justify-content:end;gap:10px;margin-top:20px;flex-wrap:wrap}.empty{padding:35px;text-align:center}.nowrap{white-space:nowrap}[hidden]{display:none!important}@media(max-width:600px){header{padding:16px}main{padding:0 12px}h1{font-size:18px}.card{padding:18px}th,td{padding:10px}.toolbar label{min-width:130px}}
</style>
</head>
<body>
<header><div><h1>SMARTMARKET-GUAYAQUIL</h1><small>Administración comercial</small></div><div id="sesion"></div></header>
<main>
<div id="mensaje" role="status" aria-live="polite" hidden></div>
<section id="login" class="card login"><h2>Iniciar sesión</h2><p class="muted">Utiliza tu cuenta del sistema.</p>
<form id="loginForm"><label><span>Correo electrónico</span><input name="correo" type="email" required maxlength="150" autocomplete="username"></label><label><span>Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Ingresar</button></form></section>
<section id="app" hidden><nav id="nav"></nav><div id="contenido"></div></section>
</main>
<dialog id="modal"><div id="modalContenido"></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=location.protocol==='file:'?'http://localhost:3000':location.origin;
let token='',usuario=null,pagina='resumen',ocupado=false,registros=[],catalogo=[],carrito=new Map();
const secciones={resumen:'Resumen',productos:'Productos',clientes:'Clientes',inventario:'Inventario',historial:'Historial',ventas:'Ventas'};
const modal=$('#modal');
const money=v=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(Number(v));
const fecha=v=>new Intl.DateTimeFormat('es-EC',{timeZone:'America/Guayaquil',dateStyle:'short',timeStyle:'short'}).format(new Date(v));
function mensaje(t,error=false){$('#mensaje').hidden=!t;$('#mensaje').textContent=t;$('#mensaje').className=error?'error':'';}
function acceso(){const dentro=!!token;$('#login').hidden=dentro;$('#app').hidden=!dentro;$('#sesion').innerHTML=dentro?`${E(usuario.nombre)} · ${E(usuario.rol)} <button id="salir">Cerrar sesión</button>`:'';}
function controles(){document.querySelectorAll('button').forEach(b=>b.disabled=ocupado||b.dataset.bloqueado==='1');}
async function tarea(fn){if(ocupado)return;ocupado=true;controles();try{await fn();}catch(e){mensaje(e.message,true);}finally{ocupado=false;controles();}}
async function api(ruta,metodo='GET',datos){const muta=metodo!=='GET'&&ruta!=='/login';const c=new AbortController();const timer=setTimeout(()=>c.abort(),20000);try{const r=await fetch(API+ruta,{method:metodo,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(datos?{body:JSON.stringify(datos)}:{}),signal:c.signal});let d;try{d=await r.json();}catch{throw Object.assign(Error('Respuesta inesperada del servidor.'),{incierto:muta});}if(!r.ok){if(r.status===401&&token){token='';usuario=null;modal.close();acceso();}throw Object.assign(Error(d.mensaje||'No se pudo completar la operación.'),{incierto:muta&&r.status>=500});}return d;}catch(e){if(e instanceof TypeError||e.name==='AbortError')throw Object.assign(Error('No se pudo confirmar la respuesta. Revisa que el backend esté encendido.'),{incierto:muta});throw e;}finally{clearTimeout(timer);}}
function tabla(titulos,filas){return filas.length?`<div class="table"><table><thead><tr>${titulos.map(t=>`<th>${E(t)}</th>`).join('')}</tr></thead><tbody>${filas.join('')}</tbody></table></div>`:'<div class="card empty">No hay registros con estos filtros.</div>';}
function boton(accion,id,texto,clase=''){return `<button class="${clase}" data-accion="${accion}" data-id="${E(id)}">${texto}</button>`;}
function abrir(html){$('#modalContenido').innerHTML=html+'<div class="actions"><button id="cerrarModal">Cerrar</button></div>';modal.showModal();controles();}
function filtros(){return `<form id="filtros" class="toolbar"><label><span>${pagina==='ventas'?'Cliente o número de venta':'Nombre del producto'}</span><input name="busqueda" maxlength="150"></label><label><span>Desde</span><input name="desde" type="date"></label><label><span>Hasta</span><input name="hasta" type="date"></label><button class="primary">Buscar</button><button type="button" id="limpiar">Limpiar</button></form><p class="muted">Hasta 200 registros · fechas de Ecuador.</p>`;}
function consulta(){const f=$('#filtros');if(!f)return '';const d=Object.fromEntries(new FormData(f));if(d.desde&&d.hasta&&d.desde>d.hasta)throw Error('Revisa el intervalo de fechas.');return '?'+new URLSearchParams(d);}
async function cargar(){const ruta=pagina==='historial'?'/inventario/historial':('/'+pagina);const d=await api(ruta+(['ventas','historial'].includes(pagina)?consulta():''));if(pagina==='resumen'){const r=d.resumen;$('#datos').innerHTML=`<p class="muted">Ventas registradas de hoy en Ecuador. Las ventas anuladas se excluyen.</p><div class="grid">${[['Ventas de hoy',r.ventas_hoy],['Total vendido hoy',money(r.total_hoy)],['Clientes activos',r.clientes],['Productos activos',r.productos],['Sin existencias',r.sin_stock],['Stock bajo (1 a 5)',r.stock_bajo]].map(([k,v])=>`<article class="card"><div>${E(k)}</div><div class="metric">${E(v)}</div></article>`).join('')}</div>`;return;}
registros=d[pagina==='historial'?'movimientos':pagina];dibujar();}
function dibujar(){let filas=[],titulos=[];const q=($('#buscarLocal')?.value||'').toLowerCase();const rs=registros.filter(r=>[r.nombre,r.identificacion,r.telefono].join(' ').toLowerCase().includes(q));if(pagina==='productos'){titulos=['Producto','Descripción','Precio','Acciones'];filas=rs.map(r=>`<tr><td>${E(r.nombre)}</td><td>${E(r.descripcion)}</td><td>${money(r.precio)}</td><td class="nowrap">${boton('editar',r.id,'Editar')}${boton('desactivar',r.id,'Desactivar','danger')}</td></tr>`);}
if(pagina==='clientes'){titulos=['Cliente','Identificación','Contacto','Acciones'];filas=rs.map(r=>`<tr><td>${E(r.nombre)}<br><small>${E(r.direccion)}</small></td><td>${E(r.identificacion)}</td><td>${E(r.telefono)}<br>${E(r.correo)}</td><td class="nowrap">${boton('editar',r.id,'Editar')}${boton('desactivar',r.id,'Desactivar','danger')}</td></tr>`);}
if(pagina==='inventario'){titulos=['Producto','Existencias','Estado','Acciones'];filas=rs.map(r=>`<tr><td>${E(r.nombre)}</td><td>${E(r.existencia)}</td><td><span class="badge ${r.existencia===0?'zero':r.existencia<=5?'low':''}">${r.existencia===0?'Sin stock':r.existencia<=5?'Stock bajo':'Disponible'}</span></td><td>${boton('movimiento',r.producto_id,'Entrada / salida')}</td></tr>`);}
if(pagina==='ventas'){titulos=['Venta','Cliente','Fecha','Estado','Total','Acciones'];filas=rs.map(r=>`<tr><td>#${E(r.id)}</td><td>${E(r.cliente_nombre)}</td><td>${fecha(r.fecha_creacion)}</td><td>${E(r.estado)}</td><td>${money(r.total)}</td><td>${boton('detalle',r.id,'Ver detalle')}</td></tr>`);}
if(pagina==='historial'){titulos=['Fecha','Producto','Movimiento','Antes → después','Motivo','Responsable'];filas=rs.map(r=>`<tr><td>${fecha(r.fecha)}</td><td>${E(r.nombre)}</td><td>${E(r.tipo)} · ${E(r.cantidad)}</td><td>${E(r.existencia_anterior)} → ${E(r.existencia_nueva)}</td><td>${E(r.motivo)}</td><td>${E(r.usuario_nombre)}</td></tr>`);}
$('#datos').innerHTML=tabla(titulos,filas);controles();}
async function navegar(p){pagina=p;$('#nav').innerHTML=Object.entries(secciones).map(([k,v])=>`<button data-pagina="${k}" class="${k===p?'active':''}">${v}</button>`).join('');$('#contenido').innerHTML=`<div class="toolbar"><h2>${secciones[p]}</h2><button id="actualizar">Actualizar</button>${['productos','clientes','ventas'].includes(p)?'<button id="nuevo" class="primary">'+(p==='ventas'?'Nueva venta':p==='clientes'?'Crear cliente':'Crear producto')+'</button>':''}</div>${['ventas','historial'].includes(p)?filtros():p!=='resumen'?'<label><span>Buscar</span><input id="buscarLocal" placeholder="Nombre del producto o cliente"></label>':''}<div id="datos" aria-live="polite">Cargando...</div>`;controles();await cargar();}
function campo(k,t,v='',max=150,tipo='text',requerido=false){return `<label><span>${t}</span><input name="${k}" type="${tipo}" value="${E(v)}" maxlength="${max}" ${requerido?'required':''}></label>`;}
function formulario(r){const cliente=pagina==='clientes';abrir(`<h2>${r?'Editar':cliente?'Crear cliente':'Crear producto'}</h2><form id="guardarCatalogo" data-id="${r?.id||''}">${campo('nombre','Nombre',r?.nombre,150,'text',true)}${cliente?campo('identificacion','Identificación',r?.identificacion,20)+campo('telefono','Teléfono',r?.telefono,30)+campo('correo','Correo',r?.correo,150,'email')+campo('direccion','Dirección',r?.direccion,250):campo('descripcion','Descripción',r?.descripcion,1000)+campo('precio','Precio',r?.precio,13,'text',true)}<button class="primary" type="submit">Guardar</button></form>`);}
function movimiento(r){abrir(`<h2>Movimiento de inventario</h2><p>${E(r.nombre)} · Existencias: ${E(r.existencia)}</p><form id="guardarMovimiento" data-id="${r.producto_id}"><label><span>Tipo</span><select name="tipo"><option value="entrada">Entrada</option><option value="salida">Salida</option></select></label><label><span>Cantidad</span><input name="cantidad" type="number" min="1" max="2147483647" step="1" required></label>${campo('motivo','Motivo','',250,'text',true)}<button class="primary">Guardar movimiento</button></form>`);}
async function detalle(id){const d=await api('/ventas/'+id),v=d.venta;abrir(`<h2>Venta #${E(id)}</h2><p>Cliente: ${E(v.cliente_nombre)}<br>Estado: ${E(v.estado)}<br>Fecha: ${fecha(v.fecha_creacion)}</p>${tabla(['Producto','Cantidad','Precio','Subtotal'],d.detalle.map(l=>`<tr><td>${E(l.nombre_producto)}</td><td>${E(l.cantidad)}</td><td>${money(l.precio_unitario)}</td><td>${money(l.subtotal)}</td></tr>`))}<h3>Total: ${money(v.total)}</h3><p>${E(v.observacion)}</p>${v.estado==='registrada'?boton('anular',id,'Anular venta','danger'):''}`);}
function centavos(v){const [a,b='']=String(v).split('.');return BigInt(a)*100n+BigInt(b.padEnd(2,'0').slice(0,2));}
function totalCarrito(){let n=0n;for(const [id,c]of carrito){n+=centavos(catalogo.find(p=>p.id===id).precio)*BigInt(c);}return `${n/100n}.${String(n%100n).padStart(2,'0')}`;}
function mostrarCarrito(){ $('#carrito').innerHTML=tabla(['Producto','Cantidad','Acción'],[...carrito].map(([id,n])=>`<tr><td>${E(catalogo.find(p=>p.id===id).nombre)}</td><td>${n}</td><td>${boton('quitar',id,'Quitar')}</td></tr>`))+`<h3>Total estimado: $${totalCarrito()}</h3>`;controles();}
async function nuevaVenta(){const [c,p,i]=await Promise.all([api('/clientes'),api('/productos'),api('/inventario')]);if(!c.clientes.length)throw Error('Primero registra un cliente.');catalogo=p.productos.map(p=>({...p,existencia:i.inventario.find(i=>i.producto_id===p.id)?.existencia||0}));carrito.clear();abrir(`<h2>Nueva venta</h2><form id="guardarVenta"><label><span>Cliente</span><select name="cliente_id" required><option value="">Selecciona un cliente</option>${c.clientes.map(c=>`<option value="${c.id}">${E(c.nombre)}</option>`).join('')}</select></label><div class="toolbar"><label><span>Producto</span><select id="productoVenta">${catalogo.filter(p=>p.existencia>0).map(p=>`<option value="${p.id}">${E(p.nombre)} · $${E(p.precio)} · stock ${p.existencia}</option>`).join('')}</select></label><label><span>Cantidad</span><input id="cantidadVenta" type="number" value="1" min="1" step="1"></label><button type="button" id="agregar">Agregar</button></div><div id="carrito"></div>${campo('observacion','Observación (opcional)','',250)}<p class="muted">El servidor confirma los precios actuales y descuenta el inventario.</p><button class="primary">Registrar venta</button></form>`);mostrarCarrito();}
async function guardar(ruta,metodo,d,form){try{const r=await api(ruta,metodo,d);modal.close();mensaje(r.mensaje||'Guardado correctamente.');await cargar();}catch(e){if(e.incierto){form.querySelectorAll('button,input,select,textarea').forEach(el=>{el.disabled=true;if(el.tagName==='BUTTON')el.dataset.bloqueado='1';});e.message+=' Cierra este formulario y consulta la lista antes de repetir.';}throw e;}}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();tarea(async()=>{mensaje('');const d=await api('/login','POST',Object.fromEntries(new FormData(e.target)));if(typeof d.token!=='string'||!d.token)throw Error('Token de acceso inválido.');token=d.token;try{usuario=(await api('/perfil')).usuario;}catch(err){token='';throw err;}acceso();await navegar('resumen');});});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-pagina]');if(b)tarea(()=>{mensaje('');return navegar(b.dataset.pagina);});});
$('#sesion').addEventListener('click',e=>{if(e.target.id==='salir'&&!ocupado){token='';usuario=null;modal.close();acceso();mensaje('Sesión cerrada.');}});
modal.addEventListener('cancel',e=>{if(ocupado)e.preventDefault();});
document.addEventListener('input',e=>{if(e.target.id==='buscarLocal')dibujar();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||ocupado)return;if(b.id==='cerrarModal'){modal.close();return;}if(b.id==='actualizar')return tarea(cargar);if(b.id==='limpiar'){$('#filtros').reset();return tarea(cargar);}if(b.id==='nuevo')return tarea(async()=>{if(pagina==='ventas')await nuevaVenta();else formulario();});if(b.id==='agregar'){const id=Number($('#productoVenta').value),n=Number($('#cantidadVenta').value),p=catalogo.find(p=>p.id===id);if(!p||!Number.isInteger(n)||n<1||n+(carrito.get(id)||0)>p.existencia)return mensaje('Cantidad inválida o existencias insuficientes.',true);carrito.set(id,n+(carrito.get(id)||0));mostrarCarrito();return;}
const a=b.dataset.accion,id=Number(b.dataset.id);if(!a)return;if(a==='quitar'){carrito.delete(id);mostrarCarrito();return;}if(a==='editar'){formulario(registros.find(r=>r.id===id));return;}if(a==='movimiento'){movimiento(registros.find(r=>r.producto_id===id));return;}if(a==='detalle')return tarea(()=>detalle(id));if(a==='desactivar'&&confirm('¿Desactivar este registro?'))return tarea(async()=>{const d=await api('/'+pagina+'/'+id+'/desactivar','PATCH');mensaje(d.mensaje);await cargar();});if(a==='anular'&&confirm('¿Anular esta venta y devolver todas sus cantidades al inventario?'))return tarea(async()=>{try{const d=await api('/ventas/'+id+'/anular','PATCH');modal.close();mensaje(d.mensaje);await cargar();}catch(e){if(e.incierto){modal.close();mensaje(e.message+' Comprueba el estado de la venta antes de repetir.',true);await cargar();}else throw e;}});
});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='loginForm')return;e.preventDefault();if(f.id==='filtros')return tarea(cargar);const d=Object.fromEntries(new FormData(f));if(f.id==='guardarCatalogo'){if(pagina==='productos'&&!/^\d{1,10}([.,]\d{1,2})?$/.test(d.precio.trim()))return mensaje('Revisa el precio: máximo dos decimales.',true);return tarea(()=>guardar('/'+pagina+(f.dataset.id?'/'+f.dataset.id:''),f.dataset.id?'PUT':'POST',d,f));}if(f.id==='guardarMovimiento'){d.producto_id=Number(f.dataset.id);d.cantidad=Number(d.cantidad);if(!Number.isInteger(d.cantidad)||d.cantidad<1)return mensaje('Ingresa una cantidad entera positiva.',true);return tarea(()=>guardar('/inventario/movimientos','POST',d,f));}if(f.id==='guardarVenta'){if(!carrito.size)return mensaje('Agrega al menos un producto.',true);if(!confirm('¿Registrar esta venta? Total estimado: $'+totalCarrito()))return;d.cliente_id=Number(d.cliente_id);d.productos=[...carrito].map(([producto_id,cantidad])=>({producto_id,cantidad}));return tarea(()=>guardar('/ventas','POST',d,f));}});
acceso();
</script>
</body>
</html>
